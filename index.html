<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYS Math Test - Level 4 Percentages</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React, ReactDOM, and Prop-Types CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.6.2/prop-types.min.js"></script>

  <!-- Recharts CDN (Requires React and ReactDOM to be loaded first) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js" crossorigin></script>

  <!-- Babel CDN for compiling JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom utility animations if needed */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.15s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- Root container for React app -->
  <div id="root"></div>

  <!-- React Script containing the application logic -->
  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;
    
    // Support both uppercase and lowercase global exposures of Recharts in different build targets
    const Recharts = window.Recharts || window.recharts || {};
    const {
      BarChart,
      Bar,
      XAxis,
      YAxis,
      CartesianGrid,
      Tooltip,
      ResponsiveContainer,
      Cell,
      LabelList
    } = Recharts;

    // Deep, rich Scarsdale Maroon and refined outline colors for other districts
    const DISTRICT_COLORS = {
      'Scarsdale': '#5C061C',       // Rich Deep Maroon (Solid Fill)
      'Blind Brook-Rye': '#ea580c', // Orange Outline
      'Bronxville': '#16a34a',      // Green Outline
      'Edgemont': '#dc2626',        // Red Outline
      'Chappaqua': '#9333ea',       // Purple Outline
      'Byram Hills': '#0891b2',     // Cyan Outline
      'Rye City': '#ca8a04'         // Yellow/Gold Outline
    };

    const rawData = [
      // --- 2024 DATA ---
      // Grade 3
      { Year: 2024, Grade: 3, District: 'Scarsdale', Percent: 46.2 },
      { Year: 2024, Grade: 3, District: 'Edgemont', Percent: 41.5 },
      { Year: 2024, Grade: 3, District: 'Blind Brook-Rye', Percent: 35.3 },
      { Year: 2024, Grade: 3, District: 'Chappaqua', Percent: 33.0 },
      { Year: 2024, Grade: 3, District: 'Bronxville', Percent: 31.3 },
      { Year: 2024, Grade: 3, District: 'Rye City', Percent: 29.1 },
      { Year: 2024, Grade: 3, District: 'Byram Hills', Percent: 25.1 },
      // Grade 4
      { Year: 2024, Grade: 4, District: 'Scarsdale', Percent: 56.9 },
      { Year: 2024, Grade: 4, District: 'Bronxville', Percent: 56.9 },
      { Year: 2024, Grade: 4, District: 'Byram Hills', Percent: 47.7 },
      { Year: 2024, Grade: 4, District: 'Blind Brook-Rye', Percent: 46.6 },
      { Year: 2024, Grade: 4, District: 'Edgemont', Percent: 44.4 },
      { Year: 2024, Grade: 4, District: 'Rye City', Percent: 43.5 },
      { Year: 2024, Grade: 4, District: 'Chappaqua', Percent: 42.7 },
      // Grade 5
      { Year: 2024, Grade: 5, District: 'Scarsdale', Percent: 53.8 },
      { Year: 2024, Grade: 5, District: 'Chappaqua', Percent: 47.9 },
      { Year: 2024, Grade: 5, District: 'Edgemont', Percent: 47.5 },
      { Year: 2024, Grade: 5, District: 'Byram Hills', Percent: 44.4 },
      { Year: 2024, Grade: 5, District: 'Rye City', Percent: 40.0 },
      { Year: 2024, Grade: 5, District: 'Blind Brook-Rye', Percent: 36.6 },
      { Year: 2024, Grade: 5, District: 'Bronxville', Percent: 36.0 },
      // Grade 6
      { Year: 2024, Grade: 6, District: 'Chappaqua', Percent: 62.1 },
      { Year: 2024, Grade: 6, District: 'Edgemont', Percent: 52.7 },
      { Year: 2024, Grade: 6, District: 'Blind Brook-Rye', Percent: 50.7 },
      { Year: 2024, Grade: 6, District: 'Byram Hills', Percent: 41.8 },
      { Year: 2024, Grade: 6, District: 'Scarsdale', Percent: 39.9 },
      { Year: 2024, Grade: 6, District: 'Bronxville', Percent: 37.6 },
      { Year: 2024, Grade: 6, District: 'Rye City', Percent: 29.1 },

      // --- 2025 DATA ---
      // Grade 3
      { Year: 2025, Grade: 3, District: 'Scarsdale', Percent: 56.8 },
      { Year: 2025, Grade: 3, District: 'Blind Brook-Rye', Percent: 50.0 },
      { Year: 2025, Grade: 3, District: 'Bronxville', Percent: 48.6 },
      { Year: 2025, Grade: 3, District: 'Edgemont', Percent: 43.3 },
      { Year: 2025, Grade: 3, District: 'Chappaqua', Percent: 34.5 },
      { Year: 2025, Grade: 3, District: 'Byram Hills', Percent: 32.6 },
      { Year: 2025, Grade: 3, District: 'Rye City', Percent: 26.4 },
      // Grade 4
      { Year: 2025, Grade: 4, District: 'Scarsdale', Percent: 53.8 },
      { Year: 2025, Grade: 4, District: 'Bronxville', Percent: 48.7 },
      { Year: 2025, Grade: 4, District: 'Chappaqua', Percent: 48.5 },
      { Year: 2025, Grade: 4, District: 'Edgemont', Percent: 43.5 },
      { Year: 2025, Grade: 4, District: 'Byram Hills', Percent: 43.4 },
      { Year: 2025, Grade: 4, District: 'Blind Brook-Rye', Percent: 41.9 },
      { Year: 2025, Grade: 4, District: 'Rye City', Percent: 38.3 },
      // Grade 5
      { Year: 2025, Grade: 5, District: 'Scarsdale', Percent: 58.9 },
      { Year: 2025, Grade: 5, District: 'Byram Hills', Percent: 51.5 },
      { Year: 2025, Grade: 5, District: 'Chappaqua', Percent: 50.4 },
      { Year: 2025, Grade: 5, District: 'Edgemont', Percent: 48.7 },
      { Year: 2025, Grade: 5, District: 'Bronxville', Percent: 45.7 },
      { Year: 2025, Grade: 5, District: 'Rye City', Percent: 43.0 },
      { Year: 2025, Grade: 5, District: 'Blind Brook-Rye', Percent: 37.0 },
      // Grade 6
      { Year: 2025, Grade: 6, District: 'Chappaqua', Percent: 61.1 },
      { Year: 2025, Grade: 6, District: 'Scarsdale', Percent: 42.0 },
      { Year: 2025, Grade: 6, District: 'Byram Hills', Percent: 41.4 },
      { Year: 2025, Grade: 6, District: 'Edgemont', Percent: 41.2 },
      { Year: 2025, Grade: 6, District: 'Blind Brook-Rye', Percent: 37.5 },
      { Year: 2025, Grade: 6, District: 'Bronxville', Percent: 32.1 },
      { Year: 2025, Grade: 6, District: 'Rye City', Percent: 26.4 }
    ];

    const CustomTooltip = ({ active, payload }) => {
      if (active && payload && payload.length) {
        const data = payload[0].payload;
        
        // Do not display the tooltip if this is a spacer bar
        if (data.isSpacer) return null;
        
        const isScarsdale = data.district === 'Scarsdale';
        return (
          <div className="bg-white p-4 border border-slate-200 rounded shadow-lg text-sm">
            <p className="font-bold text-slate-800 mb-1 border-b pb-1 flex justify-between gap-4">
              <span>Grade {data.grade}</span>
              <span className="text-slate-400 font-normal">{data.year}</span>
            </p>
            <p className="flex items-center gap-2 mt-1">
              <span 
                className="w-3 h-3 rounded-full inline-block" 
                style={{ 
                  backgroundColor: isScarsdale ? DISTRICT_COLORS['Scarsdale'] : 'transparent',
                  border: `2px solid ${DISTRICT_COLORS[data.district]}`
                }}
              ></span>
              <span className="font-semibold text-slate-700">{data.district}:</span> 
              <span className="text-slate-900">{data.percent}%</span>
            </p>
          </div>
        );
      }
      return null;
    };

    function App() {
      const [selectedYear, setSelectedYear] = useState(2025); // Default to latest Year
      const [selectedGrades, setSelectedGrades] = useState({
        3: true,
        4: true,
        5: true,
        6: false // Default off for Grade 6
      });
      
      const [isDropdownOpen, setIsDropdownOpen] = useState(false);
      const dropdownRef = useRef(null);

      // Close custom drop-down menu automatically if user clicks away
      useEffect(() => {
        function handleClickOutside(event) {
          if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
            setIsDropdownOpen(false);
          }
        }
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      const handleGradeToggle = (grade) => {
        setSelectedGrades((prev) => ({
          ...prev,
          [grade]: !prev[grade]
        }));
      };

      const processedData = useMemo(() => {
        const grades = [3, 4, 5, 6];
        const activeGrades = grades.filter(g => selectedGrades[g]);
        const chartData = [];
        
        activeGrades.forEach((grade, index) => {
          // 1. Filter raw records by Grade & selected Year
          const gradeData = rawData.filter(d => d.Grade === grade && d.Year === selectedYear);
          
          // 2. Sort highest to lowest
          gradeData.sort((a, b) => b.Percent - a.Percent);
          
          // 3. Inject a dynamic spacer *between* active clusters
          if (index > 0) {
            chartData.push({
              name: `spacer-${grade}`,
              isSpacer: true,
              grade: grade,
              district: 'Spacer',
              percent: 0,
            });
          }

          // 4. Populate dynamic values
          gradeData.forEach((item) => {
            chartData.push({
              name: `G${grade}-${item.District}`, 
              grade: grade,
              district: item.District,
              percent: item.Percent,
              year: selectedYear,
              isSpacer: false,
            });
          });
        });
        
        return chartData;
      }, [selectedGrades, selectedYear]);

      const centerTicks = useMemo(() => {
        const ticks = [];
        const grades = [3, 4, 5, 6];
        const activeGrades = grades.filter(g => selectedGrades[g]);
        
        activeGrades.forEach(grade => {
          const gradeItems = processedData.filter(d => d.grade === grade && !d.isSpacer);
          if (gradeItems.length > 0) {
            const middleItem = gradeItems[Math.floor(gradeItems.length / 2)];
            ticks.push(middleItem.name);
          }
        });
        
        return ticks;
      }, [processedData, selectedGrades]);

      // Construct label showing active grades summary
      const dropdownButtonText = useMemo(() => {
        const activeGrades = [3, 4, 5, 6].filter(g => selectedGrades[g]);
        if (activeGrades.length === 4) return "All Grades";
        if (activeGrades.length === 0) return "No Grades Selected";
        return `Grades: ${activeGrades.join(', ')}`;
      }, [selectedGrades]);

      const CustomSidewaysLabel = (props) => {
        const { x, y, width, value, index } = props;
        if (!value || value === 0) return null;

        const entry = processedData[index];
        if (!entry || entry.isSpacer) return null;

        const isScarsdale = entry.district === 'Scarsdale';
        const districtColor = DISTRICT_COLORS[entry.district] || '#475569';

        // Horizontal center of the bar
        const cx = x + width / 2;
        // Start 12px below the top of the bar inside the bar structure
        const cy = y + 12;

        return (
          <g transform={`translate(${cx}, ${cy})`}>
            <text
              x={0}
              y={0}
              transform="rotate(90)"
              textAnchor="start"
              dominantBaseline="middle"
              fill={isScarsdale ? '#ffffff' : districtColor}
              style={{
                fontSize: '13px',       // Larger font size
                fontWeight: 400,        // Regular font style
                fontFamily: 'ui-sans-serif, system-ui, -apple-system, sans-serif',
                letterSpacing: '0.025em'
              }}
            >
              {value.toFixed(1)}%
            </text>
          </g>
        );
      };

      return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8 flex flex-col items-center justify-center font-sans">
          <div className="w-full max-w-7xl bg-white rounded-xl shadow-xl overflow-hidden border border-slate-100">
            
            {/* Header Section */}
            <div className="p-6 md:p-8 border-b border-slate-100 bg-white flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h1 className="text-2xl md:text-3xl font-bold text-slate-900 flex items-center gap-3">
                  <span className="inline-block w-4 h-8 bg-[#5C061C] rounded-sm"></span>
                  NYS Math Test
                </h1>
                <p className="text-slate-600 text-base md:text-lg font-medium mt-1">
                  Percentage of Students Scoring Level 4
                </p>
              </div>

              {/* Controls: Year Selector & Grade Dropdown Filter */}
              <div className="flex flex-wrap items-center gap-4">
                
                {/* Year Segmented Selector */}
                <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
                  {[2024, 2025].map((year) => (
                    <button
                      key={year}
                      onClick={() => setSelectedYear(year)}
                      className={`px-4 py-1.5 text-sm font-semibold rounded-md transition-all cursor-pointer ${
                        selectedYear === year
                          ? 'bg-white text-[#5C061C] shadow-sm font-bold'
                          : 'text-slate-500 hover:text-slate-900'
                      }`}
                    >
                      {year}
                    </button>
                  ))}
                </div>

                {/* Custom Click-Outside Dropdown for Grade Filtering */}
                <div className="relative" ref={dropdownRef}>
                  <button
                    onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                    className="flex items-center justify-between gap-3 bg-white px-4 py-2 rounded-lg border border-slate-200 text-sm font-semibold text-slate-700 hover:border-slate-300 active:border-[#5C061C] transition-all min-w-[180px] shadow-sm cursor-pointer"
                  >
                    <span>{dropdownButtonText}</span>
                    <svg 
                      className={`w-4 h-4 text-slate-500 transition-transform duration-200 ${isDropdownOpen ? 'rotate-180' : ''}`} 
                      fill="none" 
                      viewBox="0 0 24 24" 
                      stroke="currentColor"
                    >
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 9l-7 7-7-7" />
                    </svg>
                  </button>

                  {isDropdownOpen && (
                    <div className="absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-lg shadow-xl z-50 py-1 animate-in">
                      <div className="px-3 py-1.5 border-b border-slate-100">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Filter Grades</span>
                      </div>
                      {[3, 4, 5, 6].map((grade) => (
                        <label 
                          key={grade} 
                          className="flex items-center gap-3 px-4 py-2 hover:bg-slate-50 cursor-pointer select-none transition-colors"
                        >
                          <input
                            type="checkbox"
                            checked={selectedGrades[grade]}
                            onChange={() => handleGradeToggle(grade)}
                            className="w-4 h-4 rounded text-[#5C061C] border-slate-300 transition-colors focus:ring-0 focus:ring-offset-0"
                            style={{ accentColor: '#5C061C' }}
                          />
                          <span className={`text-sm font-semibold ${selectedGrades[grade] ? 'text-slate-900 font-bold' : 'text-slate-500'}`}>
                            Grade {grade}
                          </span>
                        </label>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            </div>

            {/* Chart Viewport Section */}
            <div className="p-4 md:p-6 w-full h-[60vh] min-h-[500px] flex items-center justify-center relative">
              {processedData.filter(d => !d.isSpacer).length === 0 ? (
                <div className="text-center p-8 bg-slate-50 rounded-lg border border-dashed border-slate-300 max-w-sm">
                  <p className="text-slate-500 font-medium">
                    No grades selected. Please check at least one grade in the filter panel to display the chart.
                  </p>
                </div>
              ) : (
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart
                    data={processedData}
                    margin={{ top: 25, right: 30, left: 20, bottom: 40 }}
                    barCategoryGap="12%"
                  >
                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                    
                    <XAxis 
                      dataKey="name" 
                      ticks={centerTicks}
                      tickFormatter={(tickName) => {
                        const match = tickName.match(/^G(\d+)-/);
                        return match ? `Grade ${match[1]}` : '';
                      }}
                      axisLine={{ stroke: '#cbd5e1' }}
                      tickLine={false}
                      tick={{ fill: '#334155', fontSize: 14, fontWeight: 700 }}
                      dy={12}
                    />
                    
                    <YAxis 
                      axisLine={false}
                      tickLine={false}
                      tick={{ fill: '#64748b', fontSize: 12 }}
                      tickFormatter={(val) => `${val}%`}
                      domain={[0, 70]}
                    />
                    
                    <Tooltip 
                      content={<CustomTooltip />} 
                      cursor={{ fill: '#f8fafc' }} 
                    />
                    
                    {/* Dynamic Bar series allowing selective solid filling vs crisp outline sketching */}
                    <Bar 
                      dataKey="percent" 
                      radius={[4, 4, 0, 0]} 
                      isAnimationActive={true}
                    >
                      {processedData.map((entry, index) => {
                        if (entry.isSpacer) {
                          return <Cell key={`cell-${index}`} fill="transparent" stroke="transparent" />;
                        }
                        
                        const isScarsdale = entry.district === 'Scarsdale';
                        return (
                          <Cell 
                            key={`cell-${index}`} 
                            fill={isScarsdale ? DISTRICT_COLORS['Scarsdale'] : 'transparent'} 
                            stroke={DISTRICT_COLORS[entry.district]}
                            strokeWidth={2}
                          />
                        );
                      })}
                      
                       <LabelList 
                          dataKey="percent" 
                          content={<CustomSidewaysLabel />}
                        />
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              )}
            </div>

            {/* Harmonized Custom Legend Section */}
            <div className="p-6 bg-slate-50 border-t border-slate-100 flex flex-wrap justify-center gap-4 md:gap-6">
              {Object.entries(DISTRICT_COLORS).map(([district, color]) => {
                const isScarsdale = district === 'Scarsdale';
                return (
                  <div key={district} className="flex items-center gap-2">
                    <div 
                      className="w-4 h-4 rounded shadow-sm transition-all" 
                      style={{ 
                        backgroundColor: isScarsdale ? color : 'transparent',
                        border: `2px solid ${color}`,
                      }}
                    ></div>
                    <span className={`text-sm font-semibold ${isScarsdale ? 'text-slate-900 font-bold' : 'text-slate-600'}`}>
                      {district}
                    </span>
                  </div>
                );
              })}
            </div>

          </div>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
